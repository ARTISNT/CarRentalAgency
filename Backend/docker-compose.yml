version: '3.9'

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: always
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI


  mssql-users:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: UserDb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-users-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mssql-rentals:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: RentalDb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - mssql-rentals-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mssql-cars:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: CarDb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    ports:
      - "1435:1433"
    volumes:
      - mssql-cars-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mssql-contracts:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ContractDb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    ports:
      - "1436:1433"
    volumes:
      - mssql-contracts-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  car-service:
    build:
      context: .
      dockerfile: Services/CarService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >
        Server=mssql-cars,1433;
        Database=CarDb;
        User Id=sa;
        Password=${MSSQL_PASSWORD};
        TrustServerCertificate=True;

      MessageBroker__User: ${RABBITMQ_DEFAULT_USER}
      MessageBroker__Password: ${RABBITMQ_DEFAULT_PASS}

      InternalJwt__SecretKey: ${InternalJWT_KEY}
      InternalJwt__Issuer: ${InternalJWT_ISSUER}
      InternalJwt__Audience: ${InternalJWT_AUDIENCE}

      UserJwt__SecretKey: ${UserJWT_KEY}
      UserJwt__Issuer: ${UserJWT_ISSUER}
      UserJwt__Audience: ${UserJWT_AUDIENCE}
    depends_on:
      mssql-cars:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: Services/UserService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >
        Server=mssql-users,1433;
        Database=UserDb;
        User Id=sa;
        Password=${MSSQL_PASSWORD};
        TrustServerCertificate=True;

      InternalJwt__SecretKey: ${InternalJWT_KEY}
      InternalJwt__Issuer: ${InternalJWT_ISSUER}
      InternalJwt__Audience: ${InternalJWT_AUDIENCE}

      UserJwt__SecretKey: ${UserJWT_KEY}
      UserJwt__Issuer: ${UserJWT_ISSUER}
      UserJwt__Audience: ${UserJWT_AUDIENCE}

      EmailVerification__TokenSecret: ${EMAIL_VERIFICATION_SECRET}
      App__VerificationUrl: ${APP_VERIFICATION_URL}
      App__FrontendBaseUrl: ${APP_FRONTEND_BASE_URL}
      NotificationService__BaseUrl: http://notification-service:8080
    depends_on:
      mssql-users:
        condition: service_healthy
      notification-service:
        condition: service_started

  rental-service:
    build:
      context: .
      dockerfile: Services/RentalService/Dockerfile

    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >
        Server=mssql-rentals,1433;
        Database=RentalDb;
        User Id=sa;
        Password=${MSSQL_PASSWORD};
        TrustServerCertificate=True;

      MessageBroker__User: ${RABBITMQ_DEFAULT_USER}
      MessageBroker__Password: ${RABBITMQ_DEFAULT_PASS}

      InternalJwt__SecretKey: ${InternalJWT_KEY}
      InternalJwt__Issuer: ${InternalJWT_ISSUER}
      InternalJwt__Audience: ${InternalJWT_AUDIENCE}

      UserJwt__SecretKey: ${UserJWT_KEY}
      UserJwt__Issuer: ${UserJWT_ISSUER}
      UserJwt__Audience: ${UserJWT_AUDIENCE}
    depends_on:
      mssql-rentals:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  contract-service:
    build:
      context: .
      dockerfile: Services/ContractService/Dockerfile      
    ports:
      - "5004:8080"
    volumes:
      - ./Storage/Contracts:/data/contracts:Z

    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >
        Server=mssql-contracts,1433;
        Database=ContractDb;
        User Id=sa;
        Password=${MSSQL_PASSWORD};
        TrustServerCertificate=True;

      MessageBroker__User: ${RABBITMQ_DEFAULT_USER}
      MessageBroker__Password: ${RABBITMQ_DEFAULT_PASS}
      InternalJwt__SecretKey: ${InternalJWT_KEY}
      InternalJwt__Issuer: ${InternalJWT_ISSUER}
      InternalJwt__Audience: ${InternalJWT_AUDIENCE}

      UserJwt__SecretKey: ${UserJWT_KEY}
      UserJwt__Issuer: ${UserJWT_ISSUER}
      UserJwt__Audience: ${UserJWT_AUDIENCE}

      ContractCertificate__Password: ${ContractCertificate_PASSWORD}
    depends_on:
      mssql-contracts:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: ./Services/NotificationService/Dockerfile
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      MessageBroker__Host: rabbitmq
      MessageBroker__User: ${RABBITMQ_DEFAULT_USER}
      MessageBroker__Password: ${RABBITMQ_DEFAULT_PASS}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__UseSsl: ${SMTP_USE_SSL}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__ToAddress: ${SMTP_TO_ADDRESS}
    depends_on:
      rabbitmq:
        condition: service_started

  mssql-payments:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: PaymentDb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    ports:
      - "1437:1433"
    volumes:
      - mssql-payments-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  payment-service:
    build:
      context: .
      dockerfile: Services/PaymentService/Dockerfile
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >
        Server=mssql-payments,1433;
        Database=PaymentDb;
        User Id=sa;
        Password=${MSSQL_PASSWORD};
        TrustServerCertificate=True;

      MessageBroker__User: ${RABBITMQ_DEFAULT_USER}
      MessageBroker__Password: ${RABBITMQ_DEFAULT_PASS}

      InternalJwt__SecretKey: ${InternalJWT_KEY}
      InternalJwt__Issuer: ${InternalJWT_ISSUER}
      InternalJwt__Audience: ${InternalJWT_AUDIENCE}

      UserJwt__SecretKey: ${UserJWT_KEY}
      UserJwt__Issuer: ${UserJWT_ISSUER}
      UserJwt__Audience: ${UserJWT_AUDIENCE}

      BePaid__ShopId: ${BEPAID_SHOP_ID:-4225}
      BePaid__SecretKey: ${BEPAID_SECRET_KEY:-3834fbef1fe6ea024ef77f5c79ec7ff1ba710ea6241c08c2f341afda8af4c1c4}
      BePaid__CallbackUrl: ${BEPAID_CALLBACK_URL:-http://localhost:5173/payment/callback}
      BePaid__NotificationUrl: ${BEPAID_NOTIFICATION_URL:-https://your-ngrok-url.ngrok-free.dev/api/payments/webhook}
    depends_on:
      mssql-payments:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  gateway:
    build:
      context: ./Gateway/CarRentalAgency.GateWay/CarRentalAgency.GateWay
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development 
    depends_on:
      - car-service
      - user-service
      - rental-service
      - contract-service
      - payment-service

volumes:
  mssql-users-data:
  mssql-rentals-data:
  mssql-cars-data:
  mssql-contracts-data:
  mssql-payments-data:
  rabbitmq_data:
